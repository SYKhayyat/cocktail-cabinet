name: Verify games

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CDP_URL: http://127.0.0.1:9321
      CDP_PEER_URL: http://127.0.0.1:9322
      COCKTAIL_URL: http://127.0.0.1:8765/
      REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check
      # Browser smoke suite: Chromium with CDP enabled, plus a static server.
      - name: Start the static server
        run: |
          PORT=8765 node scripts/serve-with-headers.mjs &
          for _ in $(seq 1 50); do
            curl -sf http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
      # Chrome for Testing, rather than the distro chromium package, which on
      # Ubuntu is a snap stub and does not expose a usable binary to CI.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Start Chrome with remote debugging
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --headless=new --disable-gpu --no-sandbox \
            --remote-debugging-port=9321 --user-data-dir=/tmp/smoke-profile \
            about:blank &
          "$CHROME_PATH" --headless=new --disable-gpu --no-sandbox \
            --remote-debugging-port=9322 --user-data-dir=/tmp/smoke-peer-profile \
            about:blank &
          for _ in $(seq 1 50); do
            curl -sf http://127.0.0.1:9321/json/version >/dev/null && curl -sf http://127.0.0.1:9322/json/version >/dev/null && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:9321/json/version >/dev/null
          curl -fsS http://127.0.0.1:9322/json/version >/dev/null
      - run: npm run test:browser:all
